[project]
name = "riskzero"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jax[cuda12]==0.6.0",
    "dm-haiku @ git+https://github.com/deepmind/dm-haiku",
    "wandb",
    "pydantic-yaml",
    "pgx",
    "optax",
    "distrax",
    "omegaconf",
    "chex",
    "flashbax",
    "gymnax",
    "jax-tqdm",
    "haiku-geometric",
    "networkx",
    "pulp",
    "matplotlib",
    "numpy",
    "scipy",
]

[[tool.uv.index]]
name = "jax-cuda12"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"

[tool.ty]
python-version = "3.10"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741", "E731", "E501"]
